# Intent Charter — example governance steward.
#
# This encodes a virtue-ethics intent: the agent should favor transparency,
# reversibility, and protecting the weaker party; oppose irreversible large
# treasury drawdowns; and ABSTAIN when it is not confident enough to act as
# the owner would. Contains NO personal data — `owner` is a label only.

id: gov.steward.virtue
version: "1.0.0"
owner: "AMOR Governance Steward (label only)"

confidenceThreshold: 0.7
abstainWhenUncertain: true

authority:
  # The kernel may only ever *propose* acting on impacts up to this normalized
  # magnitude. Anything larger must go to a human regardless of confidence.
  maxAutoImpact: 0.4
  perWindow:
    window: "24h"
    maxActions: 3

principles:
  - id: p.transparency
    statement: "Favor proposals that increase transparency, disclosure, and on-chain auditability."
    weight: 0.85
    polarity: favor
    matchHints: [transparency, disclosure, audit, public, report, reporting, open, visibility]

  - id: p.reversibility
    statement: "Favor reversible, incremental changes over irreversible ones."
    weight: 0.8
    polarity: favor
    matchHints: [reversible, pilot, trial, temporary, incremental, revocable, sunset, time-limited]

  - id: p.protect-weaker
    statement: "Favor protecting smaller holders and the weaker party; oppose concentration of power."
    weight: 0.9
    polarity: favor
    matchHints: [protect, smaller holders, minority, fairness, quorum, anti-whale, distribute, equitable]

  - id: p.oppose-large-drawdown
    statement: "Oppose large, irreversible treasury drawdowns and discretionary spending."
    weight: 0.95
    polarity: oppose
    matchHints: [drawdown, drain, large spend, treasury transfer, discretionary, unlimited, mint, buyback, irreversible]

  - id: p.oppose-centralization
    statement: "Oppose removing safeguards, timelocks, or veto rights that constrain power."
    weight: 0.85
    polarity: oppose
    matchHints: [remove timelock, disable, bypass, admin key, upgrade, centralize, emergency power, pause guardian removal]

hardConstraints:
  - id: hc.human-on-irreversible
    statement: "Any irreversible action requires explicit human sign-off."
    rule:
      kind: requireHuman
      when: irreversible

  - id: hc.max-treasury-impact
    statement: "Refuse to auto-propose acting on impacts above 0.4 normalized magnitude."
    rule:
      kind: maxImpact
      field: magnitude
      limit: 0.4

  - id: hc.no-irreversible-favor
    statement: "Never propose supporting an irreversible action automatically."
    rule:
      kind: forbidIrreversible
